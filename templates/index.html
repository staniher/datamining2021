<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,700,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Hôpital Shalom - Enregistrement</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <a class="navbar-brand" href="/">Hôpital Shalom</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item active"><a class="nav-link" href="/">Enregistrement</a></li>
          <li class="nav-item"><a class="nav-link" href="/patients">Liste des Patients</a></li>
          <li class="nav-item"><a class="nav-link" href="/dashboard">Tableau de Bord</a></li>
        </ul>
      </div>
    </nav>
    <div class="content">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-6">
            <div class="box">
              <h3 class="heading">Nouveau Patient</h3>
              <div style='text-align:center;font-size:15px;color:#f00;margin-bottom:10px;'>
                  {{ prediction_text }}
              </div>
              <form action="{{url_for('predict')}}" method="post">
                <div class="form-group">
                  <label>Nom Complet *</label>
                  <input type="text" class="form-control" name="nom" required>
                </div>
                <div class="row">
                  <div class="col-md-6 form-group">
                    <label>Genre *</label>
                    <select class="custom-select" name="genre">
                      <option value="1">Masculin</option>
                      <option value="0">Féminin</option>
                    </select>
                  </div>
                  <div class="col-md-6 form-group">
                    <label>Âge *</label>
                    <input type="number" step="0.01" class="form-control" name="age" required>
                  </div>
                </div>
                <div class="form-group">
                  <label>Maladie *</label>
                  <select class="custom-select" name="maladie">
                    <option value="54">Palustose</option>
                    <option value="15">Diabète</option>
                    <option value="32">Hernie</option>
                    <option value="52">Paludisme</option>
                    <option value="23">Fièvre</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Service *</label>
                  <select class="custom-select" name="service">
                    <option value="0">Pédiatrie</option>
                    <option value="1">Hospitalisation</option>
                    <option value="2">Gynécologie</option>
                    <option value="3">Néonatologie</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Date d'entrée *</label>
                  <input type="date" class="form-control" name="date" required>
                </div>
                <button class="btn btn-block btn-primary" type="submit">Prédire & Enregistrer</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
